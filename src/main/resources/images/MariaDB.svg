<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- MariaDB: dark navy with simplified seahorse silhouette -->
  <rect width="16" height="16" rx="2" fill="#003545"/>
  <!-- seahorse body: S-curve -->
  <path d="M9 3C11 3 12 4 11.5 5.5C11 7 9.5 7 9.5 8.5C9.5 10 11 10.5 10.5 12C10 13.5 8.5 14 7.5 13.5" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <!-- head circle -->
  <circle cx="9.5" cy="3.5" r="1.5" fill="white"/>
  <!-- snout -->
  <line x1="9.5" y1="2" x2="9.5" y2="1" stroke="white" stroke-width="1" stroke-linecap="round"/>
  <!-- dorsal fin hint -->
  <path d="M8 6.5C7 5.5 6.5 5 6.5 5.5C7 6.5 7 7 8 7" fill="none" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
  <!-- tail curl -->
  <path d="M7.5 13.5C6 13 5.5 11.5 6.5 11C7.5 10.5 8 11 7.5 12" fill="none" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
</svg>
